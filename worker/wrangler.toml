name = "anyedits-api"
main = "src/index.ts"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated allowlist of browser origins permitted to call the API.
ALLOWED_ORIGIN = "https://genzeditor.com,https://www.genzeditor.com,https://mobile.genzeditor.com,https://anyedits-aay.pages.dev,http://localhost:4173"
# API_BASE_URL is the Worker's own public base URL. Served from a subdomain of
# the app domain so Better Auth session cookies are same-site. Must match the
# client's API base (src/api/client.ts) and the OAuth redirect URIs registered
# in Google/GitHub (https://api.genzeditor.com/api/auth/callback/{google,github}).
API_BASE_URL = "https://api.genzeditor.com"

# Serve the Worker from api.genzeditor.com (zone already on Cloudflare).
[[routes]]
pattern = "api.genzeditor.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "anyedits-db"
database_id = "01003425-0306-45de-a0fb-4f70642af589"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV_BLOCKED_EMAIL_DOMAINS"
id = "6a4e0cf023e642368dc44d471965aec7"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1-gameroom"
new_sqlite_classes = ["GameRoom"]

[triggers]
crons = ["0 3 * * *"]
