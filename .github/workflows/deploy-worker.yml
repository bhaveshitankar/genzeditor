name: Deploy Worker

# The Cloudflare Pages Git integration builds & deploys the front end on push.
# Pages builds do NOT cover the Worker backend (sharing/auth/quota/game rooms),
# so this workflow applies D1 migrations and deploys the Worker on changes to it.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – token with "Workers Scripts:Edit" + "D1:Edit" (+ account read)
#   CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account id

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply anyedits-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# trigger: validate Worker deploy pipeline
